name: Revert unrelated GetInfo default change

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  revert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-get-info-capabilities
      - name: Restore default authenticator options
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('soft-fido2-ctap/src/authenticator.rs')
          text = path.read_text()
          old = '            options: AuthenticatorOptions::new(),'
          new = '            options: AuthenticatorOptions::default(),'
          if old not in text:
              raise SystemExit('unexpected AuthenticatorConfig::new() source')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add soft-fido2-ctap/src/authenticator.rs
          git commit -m "revert unrelated authenticator default change"
          git push origin HEAD:agent/fix-get-info-capabilities
