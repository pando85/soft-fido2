name: Apply issue 135 patch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/invalidate-credentials-on-reset
      - name: Apply patch
        run: |
          if git apply --check .agent/issue-135.patch; then
            git apply .agent/issue-135.patch
          else
            echo "Patch is already applied"
            exit 0
          fi
      - name: Format and commit source changes
        run: |
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add soft-fido2-ctap/src/authenticator.rs soft-fido2-ctap/src/types.rs
          git commit -m "invalidate wrapped credentials on reset [agent-applied]"
          git push origin HEAD:agent/invalidate-credentials-on-reset
