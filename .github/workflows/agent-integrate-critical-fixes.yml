name: Integrate critical fixes

on:
  push:
    branches:
      - agent/all-critical-fixes
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/all-critical-fixes
          fetch-depth: 0

      - name: Install udev dependency
        run: sudo apt update && sudo apt -y install libudev-dev

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate combined soft-fido2 workspace
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
