name: Apply issue 134 patch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-ctaphid-cbor-framing
      - name: Apply patch
        run: |
          if git apply --check .agent/issue-134.patch; then
            git apply .agent/issue-134.patch
          else
            echo "Patch is already applied"
            exit 0
          fi
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add soft-fido2-ctap/src/bridge.rs
          git commit -m "fix CTAPHID CBOR status framing [agent-applied]"
          git push origin HEAD:agent/fix-ctaphid-cbor-framing
