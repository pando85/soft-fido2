name: Run critical-fix integration

on:
  pull_request:
    branches:
      - agent/integration-runner-base

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/all-critical-fixes
          fetch-depth: 0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Run integration and compatibility-preparation suite
        run: bash .agent/run-integration.sh
