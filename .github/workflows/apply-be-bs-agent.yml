name: Apply BE BS implementation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-backup-eligibility-state
          fetch-depth: 0

      - name: Correct bootstrap match
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.agent/apply_be_bs.py')
          source = path.read_text()
          old = "('    /// Use constant signature counter (for privacy)\\n','    /// Backup state assigned to newly created stored credentials.\\n"
          new = "('    pub force_resident_keys: bool,\\n\\n    /// Use constant signature counter (for privacy)\\n','    pub force_resident_keys: bool,\\n\\n    /// Backup state assigned to newly created stored credentials.\\n"
          if source.count(old) != 1:
              raise SystemExit(f'bootstrap correction expected one match, got {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Apply implementation
        run: python3 .agent/apply_be_bs.py

      - name: Remove bootstrap files
        run: git rm .agent/apply_be_bs.py .github/workflows/apply-be-bs-agent.yml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: Test workspace
        run: cargo test --workspace --all-features

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Commit implementation
        run: |
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add credential backup eligibility and state'
          git push origin HEAD:agent/add-backup-eligibility-state
