name: Apply BE BS implementation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-backup-eligibility-state
          fetch-depth: 0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - name: Correct bootstrap match
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.agent/apply_be_bs.py')
          source = path.read_text()
          old = "('    /// Use constant signature counter (for privacy)\\n','    /// Backup state assigned to newly created stored credentials.\\n"
          new = "('    pub force_resident_keys: bool,\\n\\n    /// Use constant signature counter (for privacy)\\n','    pub force_resident_keys: bool,\\n\\n    /// Backup state assigned to newly created stored credentials.\\n"
          if source.count(old) != 1:
              raise SystemExit(f'bootstrap correction expected one match, got {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Apply implementation
        run: python3 .agent/apply_be_bs.py

      - name: Complete Extensions literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path('soft-fido2').rglob('*.rs'):
              source = path.read_text()
              output = []
              position = 0
              changed = False
              while match := re.search(r'(?<!struct )Extensions\s*\{', source[position:]):
                  start = position + match.start()
                  brace = position + match.end() - 1
                  depth = 0
                  end = None
                  for index in range(brace, len(source)):
                      depth += (source[index] == '{') - (source[index] == '}')
                      if depth == 0:
                          end = index + 1
                          break
                  if end is None:
                      raise SystemExit(f'unclosed Extensions literal in {path}')
                  block = source[start:end]
                  output.append(source[position:start])
                  if 'backup_state:' not in block and 'cred_random:' in block:
                      block, count = re.subn(
                          r'(?m)^(\s*)cred_random:',
                          r'\1backup_state: soft_fido2::CredentialBackupState::NotEligible,\n\1cred_random:',
                          block,
                          count=1,
                      )
                      if count != 1:
                          raise SystemExit(f'cannot patch Extensions literal in {path}')
                      changed = True
                  output.append(block)
                  position = end
              output.append(source[position:])
              if changed:
                  path.write_text(''.join(output))
          PY

      - name: Remove bootstrap files
        run: git rm -f .agent/apply_be_bs.py .github/workflows/apply-be-bs-agent.yml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: Test workspace
        run: cargo test --workspace --all-features

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Commit implementation
        run: |
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add credential backup eligibility and state'
          git push origin HEAD:agent/add-backup-eligibility-state
