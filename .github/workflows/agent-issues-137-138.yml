name: Apply assertion semantics changes

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-assertion-continuation
      - name: Apply deterministic source edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected source block not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          auth = "soft-fido2-ctap/src/authenticator.rs"
          replace(auth,
              "    pub rp_id: String,\n    pub up: bool,\n    pub uv: bool,\n}",
              "    pub rp_id: String,\n    pub up: bool,\n    pub uv: bool,\n    pub extensions: crate::extensions::GetAssertionExtensions,\n}")
          replace(auth,
              "        up: bool,\n        uv: bool,\n    ) {",
              "        up: bool,\n        uv: bool,\n        extensions: crate::extensions::GetAssertionExtensions,\n    ) {")
          replace(auth,
              "                up,\n                uv,\n            },",
              "                up,\n                uv,\n                extensions,\n            },")
          replace(auth,
              ".as_mut()\n            .ok_or(StatusCode::NoCredentials)?;",
              ".as_mut()\n            .ok_or(StatusCode::NotAllowed)?;")
          replace(auth,
              "            return Err(StatusCode::UserActionTimeout);",
              "            return Err(StatusCode::NotAllowed);")
          replace(auth,
              "            return Err(StatusCode::NoCredentials);",
              "            return Err(StatusCode::NotAllowed);")
          replace(auth,
              "        if remaining == 0 {\n            self.assertion_state = None;\n        }",
              "        if remaining == 0 {\n            self.assertion_state = None;\n        } else {\n            state.created_at = now;\n        }")

          assertion = "soft-fido2-ctap/src/commands/get_assertion.rs"
          replace(assertion,
              "    // Increment sign count (unless constant_sign_count is enabled)\n    let new_sign_count = if auth.config().constant_sign_count {\n        selected_cred.sign_count // Keep counter constant for privacy\n    } else {\n        selected_cred.sign_count + 1 // Normal incrementing behavior\n    };",
              "    // Wrapped credentials have no durable mutable counter state.\n    let new_sign_count = if auth.config().constant_sign_count || !selected_cred.discoverable {\n        0\n    } else {\n        selected_cred.sign_count.saturating_add(1)\n    };")
          replace(assertion,
              "            response_state.up,\n            response_state.uv,\n        );",
              "            response_state.up,\n            response_state.uv,\n            extensions.clone(),\n        );")
          PY
      - name: Format and commit source changes
        run: |
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add soft-fido2-ctap/src/authenticator.rs soft-fido2-ctap/src/commands/get_assertion.rs soft-fido2-ctap/src/commands/get_next_assertion.rs
          git commit -m "fix assertion continuation and counter semantics [agent-applied]"
          git push origin HEAD:agent/fix-assertion-continuation
